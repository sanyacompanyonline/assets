<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>โปสเตอร์</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet"><style>:root{--bg:#fff35c;--ink:#1a1a2e;--a:#ff5c8a;--b:#4d7cff;--on:#1a1a2e;--s:#ffffff;--r:6px;--bw:3px;--sh:6px 6px 0 #1a1a2e;--f:Kanit}*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--f),sans-serif;overflow-x:hidden}.k{background:var(--s);border-radius:var(--r);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}.ps{min-height:100vh;padding:8vh 7vw;overflow:hidden;background:radial-gradient(circle at 88% 12%,color-mix(in srgb,var(--a) 45%,transparent) 0 18vw,transparent calc(18vw + 1px)),radial-gradient(circle at 8% 96%,color-mix(in srgb,var(--b) 45%,transparent) 0 14vw,transparent calc(14vw + 1px))}.dt{display:inline-flex;flex-direction:column;align-items:center;padding:12px 28px}.dt b{font:600 48px/1 var(--f)}.ps h1{font:600 clamp(46px,11vw,128px)/1.04 var(--f);margin:22px 0 10px;max-width:900px}.ps>p{font-size:20px;max-width:520px;opacity:.8}.ps ul{list-style:none;margin-top:28px;display:grid;gap:10px}.ps li{display:flex;gap:12px;align-items:center}.ps svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.bt{display:inline-block;margin-top:30px;background:var(--a);color:var(--on);padding:14px 38px;border-radius:min(var(--r),99px);border:var(--bw) solid var(--ink);box-shadow:var(--sh);text-decoration:none;font-weight:600}</style></head><body><main class="ps"><div class="k dt"><b>15</b><span>พ.ย.</span></div><h1>ค่ายสร้างสรรค์ สนุกคิด สนุกทำ</h1><p>กิจกรรมวิชาคอมพิวเตอร์ สำหรับนักเรียนทุกระดับชั้น จัดโดยกลุ่มสาระของ ครูเฉลิมผล</p><ul><li><svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>สนามหน้าอาคารเรียน</li><li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>08.30 น. ถึง 15.00 น.</li><li><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>ผู้ดูแลกิจกรรม ครูเฉลิมผล และ คิม</li></ul><a class="bt" href="#">ลงชื่อเข้าร่วม</a></main></body></html>
