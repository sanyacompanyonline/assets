<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายงาน</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet"><style>:root{--bg:#fff35c;--ink:#1a1a2e;--a:#ff5c8a;--b:#4d7cff;--on:#1a1a2e;--s:#ffffff;--r:6px;--bw:3px;--sh:6px 6px 0 #1a1a2e;--f:Kanit}*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--f),sans-serif;overflow-x:hidden}.k{background:var(--s);border-radius:var(--r);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}.cv{min-height:100vh;display:grid;place-items:center;padding:6vh 5vw;position:relative}.blk{position:absolute;width:min(70vw,520px);aspect-ratio:1;background:var(--a);border-radius:var(--r);transform:translateX(-50%) rotate(-8deg);top:10vh;left:50%;opacity:.85}.cv .pg{position:relative;max-width:560px;width:100%;padding:56px 44px;text-align:center}.pg h1{font:600 clamp(32px,6vw,50px)/1.25 var(--f);margin:10px 0 24px}.pg small{font-weight:600;font-size:16px}.ln{opacity:.6;font-size:14px;margin-top:18px}.pg h2{font:600 32px var(--f)}.pg h3{font:400 22px var(--f)}.bd{display:inline-block;margin-top:32px;background:var(--ink);color:var(--bg);border-radius:99px;padding:4px 22px;font-size:14px}</style></head><body><main class="cv"><div class="blk"></div><div class="k pg"><small>รายงานวิชาคอมพิวเตอร์</small><h1>AI ใกล้ตัวเรา</h1><p class="ln">จัดทำโดย</p><h2>คิม</h2><p>ชั้น ม.3/1 เลขที่ 12</p><p class="ln">เสนอ</p><h3>ครูเฉลิมผล</h3><span class="bd">ภาคเรียนที่ 1 ปีการศึกษา 2569</span></div></main></body></html>
