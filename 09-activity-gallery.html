<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมุดภาพกิจกรรม</title><link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;500;700&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}
body{background:#fff8ec;color:#2a2118;font:300 17px/1.7 "Bai Jamjuree",sans-serif;padding:6vh 4vw}
header{max-width:1100px;margin:0 auto 44px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
h1{font:700 clamp(38px,7vw,78px)/1.05 "Bai Jamjuree"}
header p{max-width:340px;opacity:.7}
.g{max-width:1100px;margin:auto;columns:3 260px;column-gap:16px}
.p{break-inside:avoid;margin-bottom:16px;border-radius:22px;overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:18px;color:#fff}
.p span{font:500 16px/1.4 "Bai Jamjuree";background:#0000004d;backdrop-filter:blur(6px);border-radius:12px;padding:6px 14px}
.h1{height:300px;background:linear-gradient(150deg,#ff7a59,#ffb347)}
.h2{height:200px;background:linear-gradient(150deg,#2f80ed,#56ccf2)}
.h3{height:360px;background:linear-gradient(150deg,#27ae60,#a8e063)}
.h4{height:240px;background:linear-gradient(150deg,#9b51e0,#e96bb0)}
.h5{height:320px;background:linear-gradient(150deg,#f2994a,#eb5757)}
.h6{height:220px;background:linear-gradient(150deg,#1f4e5f,#3ec1b0)}
.h7{height:280px;background:linear-gradient(150deg,#f7c948,#f28d35)}
.h8{height:200px;background:linear-gradient(150deg,#4b6cb7,#a18cd1)}
.h9{height:300px;background:linear-gradient(150deg,#e1306c,#fd9a4a)}
footer{text-align:center;margin-top:36px;opacity:.6;font-size:15px}
</style></head><body>
<header><h1>สมุดภาพ<br>กิจกรรมโรงเรียน</h1><p>รวมช่วงเวลาดีๆ ตลอดภาคเรียนที่ผ่านมา คลิกเพื่อเปลี่ยนเป็นรูปจริงของห้องเรา</p></header>
<section class="g">
<div class="p h1"><span>วันไหว้ครู</span></div><div class="p h2"><span>กีฬาสี</span></div><div class="p h3"><span>ค่ายธรรมชาติ</span></div>
<div class="p h4"><span>งานศิลปะ</span></div><div class="p h5"><span>วันแม่แห่งชาติ</span></div><div class="p h6"><span>ทัศนศึกษา</span></div>
<div class="p h7"><span>ตลาดนัดนักเรียน</span></div><div class="p h8"><span>การแสดงดนตรี</span></div><div class="p h9"><span>วันลอยกระทง</span></div>
</section><footer>ภาคเรียนที่ 2 ปีการศึกษา 2569</footer>
</body></html>
