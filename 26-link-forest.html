<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลิงก์รวม</title><link href="https://fonts.googleapis.com/css2?family=Maitree:wght@300;400;600&display=swap" rel="stylesheet"><style>:root{--bg:#eef4e2;--ink:#24361f;--a:#3f7d27;--b:#e8b33c;--on:#ffffff;--s:#fbfdf6;--r:14px;--bw:2px;--sh:none;--f:Maitree}*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--f),sans-serif;overflow-x:hidden}.k{background:var(--s);border-radius:var(--r);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}.lk{max-width:460px;margin:auto;padding:9vh 20px;text-align:center}.av{width:112px;height:112px;border-radius:50%;margin:0 auto 18px;background:conic-gradient(var(--a),var(--b),var(--a))}.lk h1{font:600 34px var(--f)}.lk p{opacity:.7;margin-bottom:28px}.lk a{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;margin-bottom:14px;color:var(--ink);text-decoration:none;font-weight:600}.lk svg{width:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}</style></head><body><main class="lk"><div class="av"></div><h1>คิม</h1><p>นักเรียน ม.3/1 ชอบวิชาคอมพิวเตอร์</p><a class="k" href="#"><span>ผลงานโครงงานของฉัน</span><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></a><a class="k" href="#"><span>สมุดบันทึกการเรียน</span><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></a><a class="k" href="#"><span>ตารางสอบปลายภาค</span><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></a><a class="k" href="#"><span>ติดต่อ ครูเฉลิมผล</span><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></a></main></body></html>
