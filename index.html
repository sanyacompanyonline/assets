<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Domino</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');body{font-family:'Kanit',sans-serif;background-color:#3d2b1f;background-image:url('https://www.transparenttextures.com/patterns/dark-wood.png');min-height:100vh;}.wood-panel{background:#5d4037;background-image:url('https://www.transparenttextures.com/patterns/wood-pattern.png');border:8px solid #3e2723;border-radius:1.5rem;box-shadow:inset 0 0 50px rgba(0,0,0,0.5),0 20px 40px rgba(0,0,0,0.8);}.glass-card{background:rgba(255,248,225,0.92);border-radius:1rem;border:2px solid #8d6e63;}.btn-wood{background:linear-gradient(to bottom,#8d6e63,#5d4037);color:#fff8e1;border:1px solid #3e2723;text-shadow:1px 1px 2px rgba(0,0,0,0.5);}.btn-wood:hover{background:linear-gradient(to bottom,#a1887f,#6d4c41);}.score-input{background:#fff;border:2px solid #d7ccc8;border-radius:0.5rem;transition:all 0.2s;}.score-input:focus{border-color:#5d4037;background:#efebe9;box-shadow:0 0 10px rgba(93,64,55,0.3);}.near-win{color:#d32f2f;font-weight:800;text-shadow:0 0 8px rgba(211,47,47,0.3);animation:pulse 1.5s infinite;}@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}th{background-color:#d7ccc8!important;color:#3e2723!important;}.history-row:nth-child(even){background-color:#f5f5f5;}.winner-star{color:#f59e0b;margin-left:2px;filter:drop-shadow(0 0 2px rgba(0,0,0,0.2));}.top-stat-card{background:rgba(255,255,255,0.6);border:1px solid rgba(141,110,99,0.3);}.modal-fade-in{animation:fadeIn 0.3s ease-out;}@keyframes fadeIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}</style></head><body class="p-2 md:p-8"><div class="max-w-4xl mx-auto"><div class="wood-panel p-2 md:p-4"><div class="glass-card shadow-inner p-4 md:p-8"><header class="text-center mb-6 border-b-2 border-amber-200 pb-4"><h1 class="text-3xl md:text-4xl font-bold text-amber-900 flex items-center justify-center gap-3"><span class="text-4xl md:text-5xl">domino</span>บันทึกคะแนน</h1></header><!--Step 1:Configuration--><div id="setup-view" class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="block text-sm font-semibold text-amber-900 mb-2">คะแนนเป้าหมาย</label><input type="number" id="target-score" value="100" class="w-full px-4 py-3 border-2 border-amber-100 rounded-lg focus:outline-none text-xl font-bold text-amber-900"></div><div><label class="block text-sm font-semibold text-amber-900 mb-2">จำนวนคนเล่น(2-6)</label><input type="number" id="player-count" value="2" min="2" max="6" class="w-full px-4 py-3 border-2 border-amber-100 rounded-lg focus:outline-none text-xl font-bold text-amber-900"></div></div><button onclick="playClick();showNameEntry();" class="w-full btn-wood font-bold py-4 rounded-xl shadow-lg transform active:scale-95 transition-all text-xl">ตั้งค่าผู้เล่น</button><div id="hall-of-fame" class="hidden mt-8 p-4 bg-amber-50 rounded-lg border border-amber-200"><h3 class="text-center font-bold text-amber-900 mb-2">🏆 ทำเนียบแชมป์รวม</h3><div id="fame-list" class="text-center text-amber-800 space-y-1"></div></div></div><!--Step 2:Name Entry--><div id="names-view" class="hidden space-y-6"><h2 class="text-2xl font-semibold text-amber-900">ชื่อสมาชิกในวง</h2><div id="name-inputs-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div><div class="flex gap-4"><button onclick="playClick();backToSetup();" class="flex-1 bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold py-4 rounded-xl transition-all">ย้อนกลับ</button><button onclick="playClick();startGame();" class="flex-1 bg-green-700 hover:bg-green-800 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-xl">เริ่มเกม!</button></div></div><!--Step 3:Game Board--><div id="game-view" class="hidden space-y-4"><!--Top Dashboard--><div class="bg-amber-100/50 p-3 rounded-xl border border-amber-200 space-y-3"><div class="flex justify-between items-center px-1"><span class="font-bold text-amber-900" id="display-target">เป้าหมาย:100</span><div class="flex gap-2"><button onclick="playUndo();undoLastRound();" id="undo-btn" class="text-xs bg-white text-orange-800 px-3 py-1.5 rounded-lg border border-orange-200 hover:bg-orange-50 disabled:opacity-30 transition-all font-bold">↩ แก้ไข</button><button onclick="playClick();resetGame();" class="text-xs bg-white text-red-700 px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-50 transition-all font-bold">ออกเกม</button></div></div><!--Real-time Stats Header--><div id="realtime-stats" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2"><!--Stats will be injected here--></div></div><div class="overflow-x-auto border-2 border-amber-200 rounded-xl shadow-inner bg-white/50"><table class="w-full text-center"><thead><tr id="table-header" class="text-sm"></tr></thead><tbody><tr id="input-row" class="bg-white"></tr><tr id="total-row" class="bg-amber-50 font-bold text-2xl text-amber-900"></tr></tbody></table></div><button id="btn-record" onclick="recordScores()" class="w-full btn-wood text-white font-bold py-5 rounded-xl shadow-xl transition-all text-2xl border-b-4 border-amber-900 active:border-b-0 active:translate-y-1">บันทึกคะแนน(Enter)</button><div class="mt-4"><h3 class="font-bold text-amber-900 mb-2 flex justify-between items-center bg-amber-100 p-2 rounded text-sm"><span>📜 ประวัติคะแนน</span><span id="round-count" class="bg-amber-800 text-white px-3 py-0.5 rounded-full">รอบที่:0</span></h3><div class="overflow-x-auto max-h-48 overflow-y-auto rounded-lg border border-amber-100 bg-white"><table class="w-full text-sm text-gray-700 border-collapse" id="history-table"><thead class="bg-amber-50 border-b sticky top-0"><tr id="history-header"></tr></thead><tbody id="history-body"></tbody></table></div></div></div></div></div></div><!--Winner Modal(นำคลาส animate-bounce ออกแล้ว)--><div id="winner-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50"><div class="wood-panel p-2 modal-fade-in max-w-sm w-full"><div class="bg-white p-8 rounded-2xl text-center"><div class="text-7xl mb-4">👑</div><h2 class="text-3xl font-bold text-amber-900 mb-2">สิ้นสุดการแข่งขัน</h2><p id="winner-text" class="text-xl text-amber-800 mb-6 font-semibold"></p><div class="space-y-3"><button onclick="playClick();restartWithSamePlayers();" class="w-full btn-wood py-4 rounded-xl font-bold text-lg">เริ่มเกมใหม่(คนเดิม)</button><button onclick="playClick();resetGame();" class="w-full bg-gray-100 text-gray-600 py-3 rounded-xl font-bold hover:bg-gray-200">กลับหน้าหลัก</button></div></div></div></div><script>const audioCtx=new(window.AudioContext||window.webkitAudioContext)();function playSound(freq,type,duration,vol=0.1){const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);gain.gain.setValueAtTime(vol,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration);}const playClick=()=>playSound(600,'sine',0.1);const playUndo=()=>{playSound(400,'sine',0.1);setTimeout(()=>playSound(300,'sine',0.1),50);};const playWin=()=>{[523.25,659.25,783.99,1046.50].forEach((f,i)=>setTimeout(()=>playSound(f,'square',0.4,0.05),i*150));};let gameState={target:100,players:[],round:0,isFinished:false,winnerIndex:null};let championshipHistory={};function showNameEntry(){const count=parseInt(document.getElementById('player-count').value);if(count<2||count>6){alert("กรุณาเลือกจำนวนผู้เล่น 2-6 คน");return;}const container=document.getElementById('name-inputs-container');container.innerHTML='';for(let i=1;i<=count;i++){container.innerHTML+=`<div><input type="text" placeholder="ชื่อคนเล่น ${i}" id="player-name-${i}" class="player-name-input w-full px-4 py-3 border-2 border-amber-100 rounded-lg focus:border-amber-500 focus:outline-none font-bold" value="ผู้เล่น ${i}"></div>`;}document.getElementById('setup-view').classList.add('hidden');document.getElementById('names-view').classList.remove('hidden');}function backToSetup(){document.getElementById('names-view').classList.add('hidden');document.getElementById('setup-view').classList.remove('hidden');}function startGame(){const nameInputs=document.querySelectorAll('.player-name-input');gameState.target=parseInt(document.getElementById('target-score').value)||100;gameState.players=[];gameState.round=0;gameState.isFinished=false;gameState.winnerIndex=null;nameInputs.forEach(input=>{const name=input.value.trim()||"ผู้เล่น";gameState.players.push({name:name,total:0,history:[]});if(!championshipHistory[name])championshipHistory[name]=0;});renderBoard();updateStatsHeader();document.getElementById('names-view').classList.add('hidden');document.getElementById('game-view').classList.remove('hidden');document.getElementById('display-target').innerText=`เป้าหมาย:${gameState.target}แต้ม`;updateUndoButton();setTimeout(()=>document.getElementById('score-input-0')?.focus(),200);}function updateStatsHeader(){const statsContainer=document.getElementById('realtime-stats');if(!statsContainer)return;statsContainer.innerHTML='';gameState.players.forEach(p=>{let stars='';const winCount=championshipHistory[p.name]||0;for(let i=0;i<winCount;i++)stars+='⭐';statsContainer.innerHTML+=`<div class="top-stat-card p-2 rounded-lg flex flex-col items-center justify-center text-center shadow-sm"><span class="text-xs font-bold text-amber-900 truncate w-full">${p.name}</span><span class="text-xs text-amber-600 font-bold">${stars||'-'}</span></div>`;});}function renderBoard(){const header=document.getElementById('table-header');const inputRow=document.getElementById('input-row');const totalRow=document.getElementById('total-row');const historyHeader=document.getElementById('history-header');if(!header||!inputRow||!totalRow||!historyHeader)return;header.innerHTML='';inputRow.innerHTML='';totalRow.innerHTML='';historyHeader.innerHTML='';gameState.players.forEach((p,index)=>{const isWinner=gameState.winnerIndex===index;header.innerHTML+=`<th class="py-3 px-1 font-bold border-x border-amber-200 text-xs md:text-sm">${p.name}${isWinner ? '<span class="winner-star">⭐</span>':''}</th>`;inputRow.innerHTML+=`<td class="p-1 border-x border-amber-100"><input type="number" id="score-input-${index}" class="score-input w-full text-center py-3 text-xl font-bold focus:outline-none" placeholder="0" onkeydown="handleKey(event,${index})" ${gameState.isFinished ? 'disabled':''}></td>`;totalRow.innerHTML+=`<td class="py-4 border-x border-amber-200 text-xl" id="total-val-${index}">${p.total}</td>`;historyHeader.innerHTML+=`<th class="py-1 px-1 border border-amber-200 text-xs">${p.name}</th>`;});updateHistoryTable();checkNearWin();}function handleKey(e,index){if(e.key==='Enter'){if(index===gameState.players.length-1)recordScores();else{playClick();const next=document.getElementById(`score-input-${index+1}`);if(next)next.focus();}}}function recordScores(){if(gameState.isFinished)return;playClick();let winners=[];let hasInput=false;gameState.players.forEach((p,index)=>{const input=document.getElementById(`score-input-${index}`);if(!input)return;const val=parseInt(input.value)||0;if(input.value!=="")hasInput=true;p.history.push(val);p.total+=val;input.value='';});if(!hasInput)return;gameState.round++;gameState.players.forEach((p,index)=>{if(p.total>=gameState.target)winners.push({player:p,index:index});});if(winners.length>0){gameState.isFinished=true;winners.sort((a,b)=>b.player.total-a.player.total);const ultimateWinnerObj=winners[0];gameState.winnerIndex=ultimateWinnerObj.index;championshipHistory[ultimateWinnerObj.player.name]++;renderTotals();renderBoard();playWin();showWinner(ultimateWinnerObj.player.name);}else{renderTotals();updateHistoryTable();updateUndoButton();checkNearWin();const firstInput=document.getElementById('score-input-0');if(firstInput)firstInput.focus();}}function renderTotals(){gameState.players.forEach((p,index)=>{const el=document.getElementById(`total-val-${index}`);if(el)el.innerText=p.total;});const rc=document.getElementById('round-count');if(rc)rc.innerText=`รอบที่:${gameState.round}`;}function undoLastRound(){if(gameState.round===0||gameState.isFinished)return;gameState.players.forEach(p=>p.total-=(p.history.pop()||0));gameState.round--;renderTotals();updateHistoryTable();updateUndoButton();checkNearWin();const firstInput=document.getElementById('score-input-0');if(firstInput)firstInput.focus();}function updateUndoButton(){const undoBtn=document.getElementById('undo-btn');if(undoBtn){undoBtn.disabled=gameState.round===0||gameState.isFinished;}}function checkNearWin(){gameState.players.forEach((p,index)=>{const el=document.getElementById(`total-val-${index}`);if(!el)return;if(p.total>=gameState.target*0.8&&p.total<gameState.target)el.classList.add('near-win');else el.classList.remove('near-win');});}function updateHistoryTable(){const body=document.getElementById('history-body');if(!body)return;body.innerHTML='';for(let r=gameState.round-1;r>=0;r--){let rowHtml=`<tr class="history-row border-b hover:bg-amber-50">`;gameState.players.forEach(p=>{const s=p.history[r];rowHtml+=`<td class="py-1.5 border-x text-center ${s>0 ? 'text-amber-800 font-bold':'text-gray-300'}">${s}</td>`;});rowHtml+='</tr>';body.innerHTML+=rowHtml;}}function showWinner(name){const winnerText=document.getElementById('winner-text');const winnerModal=document.getElementById('winner-modal');if(winnerText&&winnerModal){winnerText.innerHTML=`${name}<span class="winner-star text-2xl">⭐</span>ชนะการแข่งขัน!`;winnerModal.classList.remove('hidden');}}function restartWithSamePlayers(){const winnerModal=document.getElementById('winner-modal');if(winnerModal)winnerModal.classList.add('hidden');gameState.players.forEach(p=>{p.total=0;p.history=[];});gameState.round=0;gameState.isFinished=false;gameState.winnerIndex=null;updateStatsHeader();renderBoard();updateUndoButton();setTimeout(()=>{const firstInput=document.getElementById('score-input-0');if(firstInput)firstInput.focus();},200);}function resetGame(){if(confirm("ล้างข้อมูลทั้งหมดและเริ่มใหม่ใช่ไหม?"))location.reload();}</script></body></html>
