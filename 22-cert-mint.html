<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เกียรติบัตร</title><link href="https://fonts.googleapis.com/css2?family=Niramit:wght@300;400;600&display=swap" rel="stylesheet"><style>:root{--bg:#f1f4f8;--ink:#1d2433;--a:#099268;--b:#4c6ef5;--on:#ffffff;--s:#ffffff;--r:10px;--bw:1px;--sh:0 8px 24px -12px #1d243366;--f:Niramit}*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--f),sans-serif;overflow-x:hidden}.k{background:var(--s);border-radius:var(--r);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}.ct{min-height:100vh;display:grid;place-items:center;padding:5vh 4vw}.fr{max-width:880px;width:100%;padding:60px 6vw;text-align:center;outline:3px double var(--a);outline-offset:-16px}.fr svg{width:64px;height:64px;fill:none;stroke:var(--a);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.fr h1{font:600 clamp(44px,9vw,88px)/1.15 var(--f);color:var(--a);margin:8px 0 14px}.fr h2{font:600 22px var(--f);margin-bottom:6px}.sg{display:flex;justify-content:space-around;gap:20px;margin-top:48px;font-size:15px}.sg i{display:block;border-bottom:2px solid var(--ink);height:34px;width:180px;max-width:100%;margin:0 auto 8px}</style></head><body><main class="ct"><div class="k fr"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/></svg><h2>เกียรติบัตรฉบับนี้มอบให้</h2><h1>คิม</h1><p>เพื่อแสดงว่าเป็นผู้มีการใช้เทคโนโลยีดีเด่น วิชาคอมพิวเตอร์ ประจำปีการศึกษา 2569</p><div class="sg"><div><i></i>ครูเฉลิมผล<br>ครูประจำชั้น</div><div><i></i>ผู้อำนวยการโรงเรียน</div></div></div></main></body></html>
